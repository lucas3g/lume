[package]
name = "lume"
version = "1.0.1"
description = "Cliente desktop do Claude com várias contas"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lume_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# O executável se chama "Lume": é o nome que o Dock mostra ao rodar em desenvolvimento.
[[bin]]
name = "Lume"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tokio = { version = "1.54.1", features = ["process", "io-util", "sync", "rt", "macros", "time"] }
rusqlite = { version = "0.42.0", features = ["bundled"] }
uuid = { version = "1.29.2", features = ["v4"] }
dirs = "7.0.0"
sha2 = "0.10"
async-trait = "0.1.92"
tauri-plugin-dialog = "2.8.4"
base64 = "0.23.1"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-notification = "2"
portable-pty = "0.9"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
ureq = { version = "3.5.2", features = ["json"] }
arboard = "3.7.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
# Lê o config.toml do Codex (exclusões de ambiente do usuário) e confere, nos testes, as sobrescritas.
toml = "1.2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[dev-dependencies]
# Relógio virtual nos testes do vigia do turno.
tokio = { version = "1.54.1", features = ["test-util"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
