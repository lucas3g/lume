name: Release

# A cada push na main, confere a versão do app. Se a release vX.Y.Z dessa versão
# ainda não existe com o latest.json, roda as verificações e publica no GitHub
# Releases o instalador NSIS do Windows e o latest.json que o updater do app
# consulta; a própria release cria a tag. Uma publicação que parou no meio (tag
# criada, arquivos faltando) é completada no push seguinte.
# Para publicar, basta subir a versão: `pnpm release X.Y.Z`.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      publish: ${{ steps.read.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ler a versão e ver se já foi publicada
        id: read
        env:
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          app=$(jq -r .version src-tauri/tauri.conf.json)
          pkg=$(jq -r .version package.json)
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          if [ "$app" != "$pkg" ] || [ "$app" != "$crate" ]; then
            echo "::error::Versões diferentes: tauri.conf.json=$app package.json=$pkg Cargo.toml=$crate. Use pnpm release X.Y.Z."
            exit 1
          fi
          echo "version=$app" >> "$GITHUB_OUTPUT"
          # Publicada só vale com o latest.json na release: sem ele, os apps instalados não veem a versão.
          assets=$(gh release view "v$app" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null || true)
          if echo "$assets" | grep -qx latest.json; then
            echo "A v$app já foi publicada; nada a fazer."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [ "$HAS_KEY" != "true" ]; then
            echo "::warning::A v$app não foi publicada: falta o secret TAURI_SIGNING_PRIVATE_KEY para assinar a atualização."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Versão nova: v$app."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  # Verificações num job próprio, com o seu tempo: compilar os testes (debug) e o
  # instalador (release) no mesmo job dobrava a compilação sob um só limite.
  checks:
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar dependências do frontend
        run: pnpm install --frozen-lockfile

      - name: Checar tipos do frontend
        run: pnpm check

      - name: Testes do núcleo
        working-directory: src-tauri
        run: cargo test

  build:
    needs: [version, checks]
    if: needs.version.outputs.publish == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar dependências do frontend
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v${{ needs.version.outputs.version }}
          releaseName: "Lume v${{ needs.version.outputs.version }}"
          releaseBody: "Baixe o instalador .exe (Windows). Versões já instaladas atualizam sozinhas."
          releaseCommitish: ${{ github.sha }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --bundles nsis
